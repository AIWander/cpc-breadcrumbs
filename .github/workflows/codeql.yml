# CodeQL static analysis. Triggers on push to main, PRs targeting main,
# and weekly to catch newly-published advisories against existing code.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '34 7 * * 1'

jobs:
  analyze:
    name: Analyze (Rust)
    # Uploading results requires code scanning, which on a PRIVATE repo needs
    # GitHub Advanced Security. This account has no GHAS (security_and_analysis
    # is null), so every run here died on "Code scanning is not enabled for this
    # repository" after burning a full Rust build. Skip instead of failing.
    # The guard clears itself the moment the repo goes public or GHAS is added,
    # so nothing has to be remembered later. `repository` is present on the push,
    # pull_request and schedule payloads, so this is correct for every trigger.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["rust"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
